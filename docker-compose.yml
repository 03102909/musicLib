version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: music_library_db
    restart: always
    environment:
      POSTGRES_USER: sofiiaperkova
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_library_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
